<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log - Abuya Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/log.css">
</head>
<body class="is-loading" data-page="log">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <section class="page-head-row">
        <div class="page-head">
          <div class="crumbs">
            <span>Utama</span>
            <span class="material-symbols-outlined">chevron_right</span>
            <span class="crumb-active">Log</span>
          </div>
          <h1>Log Aktivitas</h1>
          <p id="pageDesc">Riwayat perubahan di Approval dan ABWarehouse.</p>
        </div>
      </section>

      <div class="notice" id="denyNotice" hidden>
        <span class="material-symbols-outlined">lock</span>
        <span>Role kamu belum punya akses melihat Log. Hubungi Master ya.</span>
      </div>

      <div id="logArea" hidden>
        <div class="tabs" id="moduleTabs" role="tablist"></div>

        <section class="panel table-panel">
          <div class="toolbar">
            <div class="search-box">
              <span class="material-symbols-outlined">search</span>
              <input type="search" id="fSearch" placeholder="Cari user, aktivitas, atau nomor dokumen...">
            </div>
            <div class="filters">
              <div class="date-range" title="Filter tanggal">
                <input type="date" class="input" id="fFrom" placeholder="Dari tanggal" aria-label="Dari tanggal">
                <span>s/d</span>
                <input type="date" class="input" id="fTo" placeholder="Sampai tanggal" aria-label="Sampai tanggal">
              </div>
              <button class="chip-reset" id="resetBtn" type="button" hidden>
                <span class="material-symbols-outlined">filter_alt_off</span><span>Reset</span>
              </button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr id="theadRow"></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="pagerInfo">-</span>
            <div class="pager-btns">
              <button class="pager-btn" id="prevBtn" type="button" disabled>
                <span class="material-symbols-outlined">chevron_left</span><span>Sebelumnya</span>
              </button>
              <span class="page-num" id="pageNum">-</span>
              <button class="pager-btn" id="nextBtn" type="button" disabled>
                <span>Selanjutnya</span><span class="material-symbols-outlined">chevron_right</span>
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
<script src="js/log.js"></script>
</body>
</html>
