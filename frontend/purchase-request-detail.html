<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Purchase Request - Abuya Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/purchase-request-detail.css">
</head>
<body class="is-loading" data-page="purchase-request">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <a class="back-link" href="purchase-request.html" id="backLink"><span class="material-symbols-outlined">arrow_back</span><span>Kembali ke daftar PR</span></a>

      <section class="page-head-row">
        <div class="page-head">
        <div class="crumbs">
          <span>Approval</span>
          <span class="material-symbols-outlined">chevron_right</span>
          <span>Purchase Request</span>
          <span class="material-symbols-outlined">chevron_right</span>
          <span class="crumb-active">Detail</span>
        </div>
          <h1 id="docNumber">Memuat...</h1>
          <p id="docSub"></p>
        </div>
        <div class="page-actions" id="headActions"></div>
      </section>

      <div class="detail-layout" id="detailLayout" hidden>
        <section class="card">
          <h2 class="card-title"><span class="material-symbols-outlined">description</span>Informasi PR</h2>
          <div class="detail-grid" id="detailGrid"></div>
          <div class="info-box" id="infoBox"></div>
        </section>

        <section class="card">
          <div class="form-section-head">
            <h2 class="card-title"><span class="material-symbols-outlined">inventory_2</span>Item barang</h2>
            <span class="panel-meta" id="itemCount"></span>
          </div>
          <div class="item-adder" id="itemAdder" hidden>
            <input class="input" id="productInput" list="productList" placeholder="Ketik untuk cari barang..." autocomplete="off">
            <datalist id="productList"></datalist>
            <input type="number" class="input qty" id="qtyInput" min="1" placeholder="Jumlah">
            <button class="btn btn-primary" type="button" id="addItemBtn">
              <span class="material-symbols-outlined">add</span><span>Tambah</span>
            </button>
          </div>
          <div class="item-list" id="itemList"></div>
          <div class="form-actions" id="actions"></div>
        </section>
      </div>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
<script src="js/purchase-request-detail.js"></script>
</body>
</html>
