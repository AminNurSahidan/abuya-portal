<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sesi Stock Opname - Abuya Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/wh-session.css">
</head>
<body class="is-loading" data-page="wh-opname">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <section class="page-head-row">
        <div class="page-head">
          <div class="crumbs">
            <span>ABWarehouse</span>
            <span class="material-symbols-outlined">chevron_right</span>
            <a href="wh-opname.html">Stock Opname</a>
            <span class="material-symbols-outlined">chevron_right</span>
            <span class="crumb-active" id="crumbName">Sesi</span>
          </div>
          <h1 id="title">Memuat...</h1>
          <div class="session-meta" id="meta"></div>
        </div>
        <div class="page-actions" id="actions"></div>
      </section>

      <div class="notice" id="errorNotice" hidden>
        <span class="material-symbols-outlined">error</span>
        <span id="errorText">Sesi tidak ditemukan.</span>
      </div>

      <div id="area" hidden>
        <section class="summary-row">
          <div class="panel summary-main">
            <div class="summary-label">Progres hitung</div>
            <div class="summary-big"><span id="sumPct">0%</span><small id="sumCount">0/0 item</small></div>
            <div class="progress-track big"><div class="progress-fill" id="sumBar"></div></div>
            <div class="summary-foot">
              <span class="live" id="liveTag" hidden><span class="live-dot"></span>Update otomatis</span>
              <span id="lastUpdate"></span>
            </div>
          </div>
          <div class="zone-grid" id="zoneGrid"></div>
        </section>

        <div class="tabs" id="viewTabs" role="tablist">
          <button class="tab active" type="button" data-view="monitor" role="tab"><span class="material-symbols-outlined">monitoring</span><span>Monitor Hitung</span></button>
          <button class="tab" type="button" data-view="review" role="tab"><span class="material-symbols-outlined">fact_check</span><span>Review &amp; Finalisasi</span></button>
        </div>

        <section class="panel table-panel" id="monitorPanel">
          <div class="toolbar">
            <div class="search-box">
              <span class="material-symbols-outlined">search</span>
              <input type="search" id="fSearch" placeholder="Cari barcode, nama, atau kode produk...">
            </div>
            <div class="filters">
              <select class="select" id="fZone" aria-label="Filter zona"></select>
              <select class="select" id="fSector" aria-label="Filter sector"></select>
              <select class="select" id="fState" aria-label="Filter status hitung">
                <option value="">Semua item</option>
                <option value="uncounted">Belum dihitung</option>
                <option value="counted">Sudah dihitung</option>
              </select>
              <button class="chip-reset" id="resetBtn" type="button" hidden>
                <span class="material-symbols-outlined">filter_alt_off</span><span>Reset</span>
              </button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Lokasi</th>
                  <th>Barcode</th>
                  <th>Produk</th>
                  <th class="num">Qty</th>
                  <th>Dihitung oleh</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="pagerInfo">-</span>
            <div class="pager-btns">
              <button class="pager-btn" id="prevBtn" type="button" disabled>
                <span class="material-symbols-outlined">chevron_left</span><span>Sebelumnya</span>
              </button>
              <span class="page-num" id="pageNum">-</span>
              <button class="pager-btn" id="nextBtn" type="button" disabled>
                <span>Selanjutnya</span><span class="material-symbols-outlined">chevron_right</span>
              </button>
            </div>
          </div>
        </section>

        <section class="panel table-panel" id="reviewPanel" hidden>
          <div class="review-head">
            <div class="review-info" id="reviewInfo"></div>
            <div class="review-actions" id="reviewActions"></div>
          </div>
          <div class="toolbar">
            <div class="search-box">
              <span class="material-symbols-outlined">search</span>
              <input type="search" id="rSearch" placeholder="Cari barcode atau nama produk...">
            </div>
            <div class="filters">
              <label class="check-row small"><input type="checkbox" id="rDiffOnly"><span>Hanya yang ada selisih</span></label>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Barcode</th>
                  <th>Produk</th>
                  <th>Lokasi</th>
                  <th class="num">Qty hitung</th>
                  <th class="num">Qty final</th>
                  <th class="num">Selisih</th>
                  <th>Catatan</th>
                </tr>
              </thead>
              <tbody id="reviewBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="reviewInfoFoot">-</span>
          </div>
        </section>
      </div>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
<script src="js/wh-session.js"></script>
</body>
</html>
