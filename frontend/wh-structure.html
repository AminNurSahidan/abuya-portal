<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Struktur Gudang - Abuya Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/wh-structure.css">
</head>
<body class="is-loading" data-page="wh-structure">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <section class="page-head-row">
        <div class="page-head">
          <div class="crumbs">
            <span>ABWarehouse</span>
            <span class="material-symbols-outlined">chevron_right</span>
            <span class="crumb-active">Struktur Gudang</span>
          </div>
          <h1>Struktur Gudang</h1>
          <p>Atur zona, sector, dan produk yang dihitung di setiap sector.</p>
        </div>
        <div class="page-actions">
          <div class="dc-pick" id="dcPickBox" hidden>
            <select class="select" id="dcPick" aria-label="Pilih DC"></select>
          </div>
          <button class="btn btn-primary" type="button" id="addZoneBtn" hidden>
            <span class="material-symbols-outlined">add</span><span>Tambah Zona</span>
          </button>
        </div>
      </section>

      <div class="notice" id="noDcNotice" hidden>
        <span class="material-symbols-outlined">info</span>
        <span id="noDcText">Akun kamu belum punya akses ke DC mana pun. Hubungi Master ya.</span>
      </div>

      <div class="structure" id="area" hidden>
        <section class="panel zone-panel">
          <div class="panel-head">
            <h2 class="section-title">Zona &amp; Sector</h2>
            <span class="panel-meta" id="zoneMeta"></span>
          </div>
          <div class="zone-list" id="zoneList"></div>
        </section>

        <section class="panel table-panel place-panel">
          <div class="place-head">
            <div class="place-title">
              <span class="cell-sub" id="placeZone">Pilih sector</span>
              <h2 class="section-title" id="placeSector">-</h2>
            </div>
            <span class="panel-meta" id="placeMeta"></span>
          </div>
          <div class="adder" id="adder" hidden>
            <div class="search-box">
              <span class="material-symbols-outlined">add_box</span>
              <input type="search" id="addSearch" placeholder="Cari barcode atau nama produk untuk ditambahkan..." autocomplete="off">
            </div>
            <div class="adder-results" id="addResults" hidden></div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr id="placeHead">
                  <th class="sel-col"><input type="checkbox" id="selAll" aria-label="Pilih semua"></th>
                  <th class="num">No</th>
                  <th>Barcode</th>
                  <th>Produk</th>
                  <th>Satuan</th>
                  <th class="actions"></th>
                </tr>
              </thead>
              <tbody id="placeBody"></tbody>
            </table>
          </div>
          <div class="bulk-bar" id="bulkBar" hidden>
            <span class="material-symbols-outlined">checklist</span>
            <span id="bulkInfo"></span>
            <span class="bulk-spacer"></span>
            <button class="btn btn-sm btn-ghost" type="button" id="bulkClear">Batal pilih</button>
            <button class="btn btn-sm btn-danger-solid" type="button" id="bulkRemove"><span class="material-symbols-outlined">remove_circle</span><span>Keluarkan dari sector</span></button>
          </div>
        </section>
      </div>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
<script src="js/wh-structure.js"></script>
</body>
</html>
