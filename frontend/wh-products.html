<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk Gudang - Abuya Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/wh-products.css">
</head>
<body class="is-loading" data-page="wh-products">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <section class="page-head-row">
        <div class="page-head">
          <div class="crumbs">
            <span>ABWarehouse</span>
            <span class="material-symbols-outlined">chevron_right</span>
            <span class="crumb-active">Produk Gudang</span>
          </div>
          <h1>Produk Gudang</h1>
          <p id="pageDesc">Master produk stock opname. Huruf pertama barcode menentukan DC-nya.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-ghost" type="button" id="exportBtn" hidden>
            <span class="material-symbols-outlined">download</span><span>Export</span>
          </button>
          <button class="btn btn-ghost" type="button" id="templateBtn" hidden>
            <span class="material-symbols-outlined">description</span><span>Template</span>
          </button>
          <button class="btn btn-ghost" type="button" id="importBtn" hidden>
            <span class="material-symbols-outlined">upload_file</span><span>Import Excel</span>
          </button>
          <button class="btn btn-primary" type="button" id="addBtn" hidden>
            <span class="material-symbols-outlined">add</span><span>Tambah Produk</span>
          </button>
        </div>
      </section>

      <div class="notice" id="noDcNotice" hidden>
        <span class="material-symbols-outlined">info</span>
        <span id="noDcText">Akun kamu belum punya akses ke DC mana pun. Hubungi Master ya.</span>
      </div>

      <div id="area" hidden>
        <div class="tabs" id="statusTabs" role="tablist"></div>

        <section class="panel table-panel">
          <div class="toolbar">
            <div class="search-box">
              <span class="material-symbols-outlined">search</span>
              <input type="search" id="fSearch" placeholder="Cari barcode, nama, kode, atau kategori...">
            </div>
            <div class="filters">
              <select class="select" id="fDc" aria-label="Filter DC"></select>
              <select class="select" id="fPlaced" aria-label="Filter penempatan">
                <option value="">Semua penempatan</option>
                <option value="yes">Sudah ada di sector</option>
                <option value="no">Belum ada di sector</option>
              </select>
              <button class="chip-reset" id="resetBtn" type="button" hidden>
                <span class="material-symbols-outlined">filter_alt_off</span><span>Reset</span>
              </button>
            </div>
          </div>
          <div class="bulk-bar" id="bulkBar" hidden>
            <span class="material-symbols-outlined">checklist</span>
            <span id="bulkInfo"></span>
            <span class="bulk-spacer"></span>
            <button class="btn btn-sm btn-ghost" type="button" id="bulkClear">Batal pilih</button>
            <button class="btn btn-sm btn-ghost" type="button" id="bulkOn" hidden><span class="material-symbols-outlined">toggle_on</span><span>Aktifkan</span></button>
            <button class="btn btn-sm btn-ghost" type="button" id="bulkOff" hidden><span class="material-symbols-outlined">toggle_off</span><span>Nonaktifkan</span></button>
            <button class="btn btn-sm btn-danger-solid" type="button" id="bulkDelete" hidden><span class="material-symbols-outlined">delete</span><span>Hapus</span></button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="sel-col" id="selHead"><input type="checkbox" id="selAll" aria-label="Pilih semua di halaman ini"></th>
                  <th>Barcode</th>
                  <th>Produk</th>
                  <th>Kategori</th>
                  <th>Satuan</th>
                  <th>Lokasi</th>
                  <th>Status</th>
                  <th class="actions"></th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="pagerInfo">-</span>
            <div class="pager-btns">
              <button class="pager-btn" id="prevBtn" type="button" disabled>
                <span class="material-symbols-outlined">chevron_left</span><span>Sebelumnya</span>
              </button>
              <span class="page-num" id="pageNum">-</span>
              <button class="pager-btn" id="nextBtn" type="button" disabled>
                <span>Selanjutnya</span><span class="material-symbols-outlined">chevron_right</span>
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
<script src="js/wh-products.js"></script>
</body>
</html>
