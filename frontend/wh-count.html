<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Hitung - Abuya Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/wh-count.css">
</head>
<body class="is-loading" data-page="wh-opname">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <section class="count-head">
        <a class="back-link" id="backLink" href="wh-opname.html"><span class="material-symbols-outlined">arrow_back</span><span>Kembali ke sesi</span></a>
        <h1 id="title">Input Hitung</h1>
        <div class="count-meta" id="meta"></div>
      </section>

      <div class="notice" id="readonlyNotice" hidden>
        <span class="material-symbols-outlined">lock</span>
        <span id="readonlyText">Sesi ini tidak bisa diinput.</span>
      </div>

      <div id="area" hidden>
        <section class="panel picker">
          <div class="picker-row">
            <div class="field">
              <label for="fZone">Zona</label>
              <select class="select" id="fZone"></select>
            </div>
            <div class="field">
              <label for="fSector">Sector</label>
              <select class="select" id="fSector"></select>
            </div>
          </div>
          <form class="scan-row" id="scanForm" autocomplete="off">
            <div class="search-box scan-box">
              <span class="material-symbols-outlined">barcode_scanner</span>
              <input type="search" id="scanInput" placeholder="Scan atau ketik barcode / nama" enterkeyhint="search" autocapitalize="characters" spellcheck="false">
            </div>
            <button class="btn btn-ghost" type="button" id="cameraBtn" hidden title="Scan pakai kamera">
              <span class="material-symbols-outlined">photo_camera</span><span class="cam-label">Kamera</span>
            </button>
          </form>
        </section>

        <section class="sector-bar">
          <div class="sector-title">
            <strong id="sectorName">-</strong>
            <span id="sectorProgress"></span>
          </div>
          <label class="check-row small"><input type="checkbox" id="onlyPending"><span>Belum dihitung saja</span></label>
        </section>

        <div class="count-list" id="list"></div>
      </div>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
<script src="js/wh-count.js"></script>
</body>
</html>
