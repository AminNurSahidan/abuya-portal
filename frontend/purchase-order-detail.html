<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Purchase Order - Abuya Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/purchase-order-detail.css">
</head>
<body class="is-loading" data-page="purchase-order">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <a class="back-link" href="purchase-order.html"><span class="material-symbols-outlined">arrow_back</span><span>Kembali ke daftar PO</span></a>

      <section class="page-head-row">
        <div class="page-head">
        <div class="crumbs">
          <span>Approval</span>
          <span class="material-symbols-outlined">chevron_right</span>
          <span>Purchase Order</span>
          <span class="material-symbols-outlined">chevron_right</span>
          <span class="crumb-active">Detail</span>
        </div>
          <h1 id="docNumber">Memuat...</h1>
          <p id="docSub"></p>
        </div>
        <div class="page-actions">
          <button class="btn btn-ghost" type="button" id="exportBtn" hidden disabled>
            <span class="material-symbols-outlined">download</span><span>Export Excel</span>
          </button>
        </div>
      </section>

      <div class="detail-layout" id="detailLayout" hidden>
        <section class="card">
          <h2 class="card-title"><span class="material-symbols-outlined">receipt_long</span>Informasi PO</h2>
          <div class="detail-grid" id="detailGrid"></div>
          <div class="info-box" id="infoBox"></div>
        </section>

        <section class="card">
          <div class="form-section-head">
            <h2 class="card-title"><span class="material-symbols-outlined">inventory_2</span>Item barang</h2>
            <span class="panel-meta" id="itemCount"></span>
          </div>
          <div class="item-list" id="itemList"></div>
        </section>
      </div>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="js/app.js"></script>
<script src="js/purchase-order-detail.js"></script>
</body>
</html>
