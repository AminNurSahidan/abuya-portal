<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - Abuya Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-icon"><span class="material-symbols-outlined">hub</span></div>
    <div class="brand-text">
      <span class="brand-name">Abuya Portal</span>
      <span class="brand-sub">Centralized</span>
    </div>
  </div>
  <div class="topbar-right">
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>Sistem Normal</span>
    </div>
  </div>
</header>

<main class="stage">
  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <div class="card">
    <div class="card-head">
      <div class="logo-wrap">
        <div class="logo"><span class="material-symbols-outlined">hub</span></div>
        <span class="logo-badge"><span></span></span>
      </div>
      <h1>W e l c o m e !</h1>
      <p>Jangan lupa makan</p>
    </div>

    <div class="notice-box" id="sessionNotice" hidden></div>

    <form id="loginForm" class="form login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined icon-left">badge</span>
          <input id="username" type="text" placeholder="contoh: sm.bekasi" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined icon-left">key</span>
          <input id="password" type="password" placeholder="••••••••••••" autocomplete="current-password" required>
          <button class="icon-right" id="togglePwd" type="button" aria-label="Tampilkan sandi">
            <span class="material-symbols-outlined" id="pwdIcon">visibility</span>
          </button>
        </div>
      </div>

      <div class="form-row">
        <label class="check">
          <input type="checkbox" id="remember" checked>
          <span>Ingat saya</span>
        </label>
        <a href="#" id="forgotLink" class="link">Lupa password?</a>
      </div>

      <button class="btn-primary" id="submitBtn" type="submit">
        <span id="submitText">Masuk Sekarang</span>
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>

      <div class="feedback" id="feedback" role="status"></div>
    </form>

    <div class="card-foot">
      <span class="material-symbols-outlined">verified_user</span>
      <p>Akses hanya untuk karyawan Abuya Group</p>
    </div>
  </div>

  <p class="help">Kendala akses? <span class="strong-text">Hubungi Master Layer</span></p>
</main>

<footer class="footer">
  <div class="footer-inner">
    <span>© <span id="year"></span> Abuya Berkah Indonesia</span>
    <span class="footer-links">Head Office • Operation • Distribution Center</span>
  </div>
</footer>

<script src="js/login.js"></script>
</body>
</html>
